name: Temporary Resend contact form smoke test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_temporary-resend-smoke.yml']
permissions:
  contents: read
jobs:
  contact-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for corresponding production deployment
        env:
          MARKER: resend-smoke-ee8ac3aae1-20261122
        run: |
          set -eu
          count=0
          while [ "$count" -lt 40 ]; do
            result="$(curl -fsSL --max-time 8 "https://www.connectivestack.com/_resend-smoke-marker.txt?poll=$count" 2>/dev/null || true)"
            if [ "$result" = "$MARKER" ]; then
              echo "Production marker confirmed"
              exit 0
            fi
            count=$((count+1))
            sleep 7
          done
          echo "Production deployment was not confirmed before deadline"
          exit 1
      - name: Submit exactly one inquiry to the live Resend-backed contact form
        run: |
          set -eu
          cat > /tmp/contact-test.json <<'JSON'
          {"name":"ConnectiveStack QA Test","email":"qa-test@example.com","company":"ConnectiveStack Internal QA","message":"TEST ONLY: This is an automated contact form delivery check. No action required.","consent":"yes","website_check":""}
          JSON
          status="$(curl -sS --max-time 20 -o /tmp/contact-response.json -w "%{http_code}" -X POST "https://www.connectivestack.com/api/contact" -H "Content-Type: application/json" --data-binary @/tmp/contact-test.json)"
          echo "HTTP status: $status"
          echo "Endpoint response:"
          cat /tmp/contact-response.json
          echo
          test "$status" = "200"
          grep -q '"ok":true' /tmp/contact-response.json
